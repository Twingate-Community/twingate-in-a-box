# Apps published through the Twingate Gateway. Terraform reads this file to find
# them and never manages them: terraform apply, then docker compose up -d.
#
# To publish a service, assign it to the `twingate` network and add `twingate.enable: "true"`
# Configure the following labels to control how the Gateway interacts with the service:
# - `twingate.port`: REQUIRED for web apps - the port the service listens on. SSH defaults to 22.
# - `twingate.groups`: REQUIRED - comma-separated list of groups allowed to access the service
# - `twingate.protocol`: optional, "web" (default) or "ssh". The https, tls and header
#   labels below only apply to web apps.
# - `twingate.alias`: optional second hostname. Every service is already reachable as
#   <service>.box.internal, which the wildcard certificate covers. An alias outside that
#   domain means the certificate is reissued and the Gateway restarts.
# - `twingate.name`: optional Resource name in Twingate, defaults to the service name
# - `twingate.https`: optional, defaults to "true". The Gateway terminates TLS and the
#   app is published over https. Set "false" to publish it over plain http instead.
# - `twingate.tls`: optional, defaults to "NONE" - how the Gateway reaches the app.
#   Use VERIFY_FULL, VERIFY_CA or INSECURE for a backend that serves TLS itself.
# - `twingate.header.<Header-Name>`: optional headers to inject into requests to the service
#
# Never add port mappings. This is what `twingate.port` is for.
#
# Every optional service sits in a profile named after it, and the `services`
# Terraform variable picks which profiles are on. Terraform publishes only those
# and writes COMPOSE_PROFILES to .env, so Compose starts the same set. A service
# with no profile, like echo, is always on.

# Pinned so the project does not take its name from the directory. Container names
# feed the Prometheus targets below, and Terraform names its own containers to match.
name: twingate-in-a-box

networks:
  twingate:
    # Created by Terraform. Run terraform apply first. Docker DNS answers each
    # service on it as <service>.box.internal, which is how every service gets its
    # published name. Must match local.domain in locals.tf.
    name: box.internal
    external: true

volumes:
  openwebui:
  prometheus:
  grafana:
  uptimekuma:

configs:
  prometheus:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: gateway
          static_configs:
            - targets: ["twingate-in-a-box-gateway:9090"]
        - job_name: connector
          static_configs:
            - targets: ["twingate-in-a-box-connector:9090"]

  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://prometheus:9090
          isDefault: true

  # Loads everything in ./dashboards. Kept out of the provisioning directory so
  # Grafana does not try to read this file as a dashboard.
  grafana-dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: twingate
          type: file
          allowUiUpdates: true
          options:
            path: /etc/dashboards

  # Written by terraform apply. The public half of the SSH CA, not a secret.
  ssh-ca:
    file: ./ssh-ca.pub

services:
  # Open WebUI, using its Trusted Header SSO. The Gateway injects the identity
  # headers from the validated Twingate token, so the user is already logged in.
  # https://docs.openwebui.com/features/authentication-access/auth/sso/#trusted-header
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: [openwebui]
    restart: unless-stopped
    environment:
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Twingate-User
      WEBUI_AUTH_TRUSTED_GROUPS_HEADER: X-Twingate-Groups
      # Without this the first user becomes admin and everyone after lands in
      # "pending", which looks like a broken demo.
      DEFAULT_USER_ROLE: user
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
    volumes:
      - openwebui:/app/backend/data
    networks:
      - twingate
    labels:
      twingate.enable: "true"
      twingate.port: "8080"
      twingate.groups: "Everyone"
      # Headers injected at Gateway level. See variables.tf for the default set

  # Echoes the request back at /headers, which is the fastest way to confirm the
  # Gateway is injecting identity and separates "the Gateway isn't injecting"
  # from "my app isn't reading them".
  echo:
    image: ghcr.io/mccutchen/go-httpbin:v2.15.0
    restart: unless-stopped
    networks:
      - twingate
    labels:
      twingate.enable: "true"
      twingate.port: "8080"
      twingate.groups: "Everyone"
      # Per-Resource, so only this service sees the token -- the Gateway-wide
      # headers deliberately omit it. /headers renders the full token.
      twingate.header.Authorization: "Bearer {{jwt}}"

  # Scrapes the Gateway and the Connector. Deliberately not published: Grafana
  # reaches it over the box network, and nothing else needs to.
  prometheus:
    image: prom/prometheus:v3.5.0
    # Only here to feed Grafana, so it comes and goes with it.
    profiles: [grafana]
    restart: unless-stopped
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus:/prometheus
    networks:
      - twingate

  # Grafana verifies the Twingate token itself rather than trusting a header.
  # https://www.twingate.com/docs/web-app-grafana
  grafana:
    image: grafana/grafana:12.2.1
    profiles: [grafana]
    restart: unless-stopped
    environment:
      GF_AUTH_JWT_ENABLED: "true"
      GF_AUTH_JWT_HEADER_NAME: X-JWT-Assertion
      GF_AUTH_JWT_USERNAME_ATTRIBUTE_PATH: user.username
      GF_AUTH_JWT_EMAIL_ATTRIBUTE_PATH: user.email
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Twingate group to Grafana role. Without this everyone lands on Grafana's
      # default of Viewer, since the token carries no role Grafana recognizes.
      GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH: "contains(user.groups[*], 'Admin') && 'Admin' || 'Viewer'"
      # Checked against Twingate's public keys, so a forged token fails on
      # signature rather than on where it came from. TWINGATE_NETWORK is in .env.
      GF_AUTH_JWT_JWK_SET_URL: https://${TWINGATE_NETWORK}.twingate.com/api/v1/jwk/ec
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/twingate.yml
    volumes:
      - grafana:/var/lib/grafana
      - ./dashboards:/etc/dashboards:ro
    networks:
      - twingate
    labels:
      twingate.enable: "true"
      twingate.port: "3000"
      # Everyone exists in every tenant, so a trial account plans cleanly. Members
      # of an Admin group, where one exists, still get Grafana's Admin role above.
      twingate.groups: "Everyone"
      twingate.header.X-JWT-Assertion: "{{jwt}}"

  # Keeps its own login. Twingate supplies the name and the network isolation and
  # leaves the app's authentication alone, which is the plain reverse proxy case.
  uptimekuma:
    image: louislam/uptime-kuma:1
    profiles: [uptimekuma]
    restart: unless-stopped
    volumes:
      - uptimekuma:/app/data
    networks:
      - twingate
    labels:
      twingate.enable: "true"
      twingate.port: "3001"
      twingate.groups: "Everyone"

  # An SSH server with no keys or passwords to manage. Connect with
  # `ssh ssh.box.internal`: the Gateway takes the session and logs in here as
  # gateway, with a five-minute certificate it signs on the spot.
  # The server only trusts the SSH CA. See ssh/ for how it is built.
  ssh:
    build: ./ssh
    profiles: [ssh]
    hostname: ssh
    restart: unless-stopped
    configs:
      - source: ssh-ca
        target: /etc/ssh/twingate-ca.pub
    networks:
      - twingate
    labels:
      twingate.enable: "true"
      twingate.protocol: "ssh"
      twingate.groups: "Everyone"

  # Has no authentication at all. Publishing it is only reasonable because
  # Twingate is the sole route to it and no port is bound on the host.
  ittools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    profiles: [ittools]
    restart: unless-stopped
    networks:
      - twingate
    labels:
      twingate.enable: "true"
      twingate.port: "80"
      twingate.groups: "Everyone"
